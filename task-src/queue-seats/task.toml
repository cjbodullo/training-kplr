artifacts = ["/app/plan.csv"]

[task]
name = "afterquery/queue-seats"

[metadata]
author_name = "Shaswat Panda"
author_email = "pandashaswat712@gmail.com"
difficulty_explanation = """
This is the weekly seat plan a contact centre workforce planner produces: for every open half hour of three Asterisk 20 queues, the smallest number of agents that meets 80% of calls answered within 20 seconds and at most 5% abandoned after 10 seconds, for a week whose volumes and config differ from the history. The input is six weeks of raw app_queue queue_log (about 400,000 events: ENTERQUEUE with hashed caller tokens, CONNECT, COMPLETECALLER/COMPLETEAGENT, BLINDTRANSFER, ABANDON, RINGCANCELED, EXITWITHTIMEOUT, ADDMEMBER/REMOVEMEMBER, PAUSE/UNPAUSE with reason codes), the live queues.conf and extensions.conf, and the forecasting team's half hourly forecast. Nothing in the log is a planning parameter, and two figures that standard WFM practice takes at face value are wrong because January and February ran short staffed (abandon rates after 10 seconds of roughly a fifth to a third).
First, demand. The forecast was trended from the January and February counts of calls entering each queue (the instruction says so), and 14% to 32% of those entries were repeat attempts by callers the short staffed queues had lost, so the forecast overstates first attempt demand by 16% to 48% depending on queue and block. A plan staffed to 80/20 loses few callers and so generates few ring backs. The planner has to find the repeats (same hashed caller token, same queue, same day, after a lost call), deflate the forecast to first attempts, estimate how often a lost caller rings back and how that decays with attempts, and add back the ring backs its own plan causes, which depends on the seats chosen.
Second, handle time. Callers come in two kinds the log never labels: quick queries with short calls and little patience, and complex enquiries with long calls and a lot of patience. In a congested queue quick callers hang up before an agent reaches them, so every talk time in the log over-represents long calls; averaging talk time per block overstates it by up to about 23%. The tell is that talk time rises with hold time; the unselected sample is calls put straight through to an agent.
Around these sit derivations an expert gets right but must not skip: an agent is unavailable for ring time, talk and then the later of wrapuptime and a manual ACW pause, with faults wrapuptime moving from 20 to 60 seconds after the log ends; talk time differs by time of day and, for billing only, by a Monday factor that six Mondays only pin down for the whole day; billing's blind transfers have a short leg and land in moving as unforecast load; patience is censored by service and the faults timeout, with sub 10 second hang ups excluded, so Kaplan Meier per attempt pool rather than averaged abandon times or Erlang C/A.
Local probe: claude-opus-5-5 at low effort, 3 attempts each. With only the handle time inference (an earlier build) 1 of 3 passed, after replaying the history against its own model and noticing the talk by hold pattern; the two failures overstaffed. With both inferences 0 of 3 passed: all three found the repeat attempts, none found the talk time selection, and all overstaffed (closest 34 half hours out after 49 minutes).
Each variant below is solution/plan.py with exactly one misreading switched on (tests/groundtruth/abl_plan.py), graded by the verifier image: forecast taken as first attempts 332 half hours out of band, forecast deflated but the plan's own ring backs ignored 0, talk time from all answered calls 78, Erlang C 56, averaged abandon times as exponential patience 1 (marginal), no transfer load in moving 94, sub 10 second abandons counted 77, one talk distribution per queue 46, billing transfer legs dropped 35, wrapuptime without ACW pauses 0, ACW added to wrapuptime 0, faults wrapuptime left at 20 0. The last four are small under staffing effects that the two seat lower allowance absorbs on their own; they are listed as decoys, not as discriminating checks. The two decisive inferences each move many half hours (332 and 78), so a plan that misses one is far outside the band rather than one seat out. An experienced WFM analyst needs most of a working day.

Data provenance: the call centre, its staff and callers are synthetic. The queue_log was produced by an agent level discrete event simulation of Asterisk app_queue behaviour (FCFS, rrmemory over idle members, ring time inside the CONNECT hold time, caller hang up during ring logged as RINGCANCELED then ABANDON, wrapuptime and paused members not offered calls, queue timeout logging EXITWITHTIMEOUT) driven by known caller and agent behaviour (two caller kinds per queue and their ring back habit, sealed in tests/groundtruth/world.py) and a historical staffing pattern that was short most of the time. Caller tokens are random hashes. The forecast is the true first attempt demand scaled by the repeat share the history actually produced, which is what trending the entry counts does. The configs were written for the task in real Asterisk 20 syntax.
"""
solution_explanation = """
Parse the queue_log per call and per agent. Mark each fresh call as a first attempt or a repeat: a repeat is a call from the same hashed caller token to the same queue on the same day after an earlier call that was lost (abandoned after 10 s or more, or timed out). Per queue and block (morning, afternoon, evening, Saturday) the share of entries that were first attempts deflates the forecast to first attempt demand. The ring back probability after a loss is estimated from first attempt losses early enough in the day to ring back before close, and its decay from second attempt losses. Ring time comes from CONNECT. Talk time comes from COMPLETE* and BLINDTRANSFER calltime (keeping transfer legs) but only for calls put through to an agent within about 5 seconds of entering the queue, because in the short staffed history the calls that queued are a selected, longer than average subset; first attempts and repeats are kept as separate pools. Talk is grouped by block, and Monday cells are the Tuesday to Friday samples scaled by one whole day Monday factor per queue. After call time per call is the span from call end to the agent's ACW UNPAUSE when an ACW PAUSE follows within a few seconds, else zero; under the March config the agent is unavailable for max(wrapuptime, span). Patience comes from a Kaplan Meier estimate per pool (first attempts, repeats, transferred callers in moving), with answered calls censored at hold time and timeouts censored at the wait. Each half hour is simulated in steady state (Poisson first attempts at the deflated forecast plus a ring back stream whose rate is solved as a fixed point from the simulated losses at the chosen seats, bootstrapped ring/talk/after/patience, FCFS, faults timeout 600 s, 400,000 calls per seat count) and the smallest N meeting both targets is taken; billing is sized first so moving's transfer load uses billing's answered calls at its planned N.
"""
verification_explanation = """
The verifier reads /app/plan.csv only and runs no agent code. It checks the header, that there is exactly one row for each of the 408 open half hours x queue of 1 to 6 March 2027 and that seats are whole numbers, then compares every row with a sealed band in /tests/bands.json. All rows must pass for reward 1; grading is a deterministic file comparison.
How the bands were made (scripts sealed in tests/groundtruth with a README): nstar is the smallest seat count meeting both targets under the TRUE caller and agent behaviour that generated the log (both caller kinds as separate streams, plus the ring backs the plan itself causes, solved as a fixed point), with the March config and the true first attempt demand, from long common random number steady state simulations (300,000 calls per seat count). A correct planner only sees six weeks of data and uses Monte Carlo, so the band is calibrated on that variation rather than on the truth alone: the reference method was re-run 16 times (12 weekday stratified day block bootstraps of the history plus 4 fresh model and simulator seed pairs) and the band is the union of nstar - 2 .. nstar + 1 and every seat count those runs produced; 9 rows ended up wider than that. The lower allowance is two seats because day bootstraps of six weeks move first attempt demand and handle time by a few per cent, which can cost a seat at the margin; the upper side stays at one seat because both decisive misreadings overstaff. Validation on runs NOT used to build the bands: 6 further bootstrap replicates, 2 further seed pairs and the shipped reference all score 0 rows out, and the shipped reference scores reward 1 in the verifier image. The solve.sh reference is seeded and deterministic. Discrimination on the same bands, graded in the verifier image, is in the difficulty explanation; padding the reference by one seat everywhere or cutting it by three both score reward 0.
"""
category = "Operations"
subcategory = "Logistics"
tags = ["workforce-management", "asterisk", "queue_log", "call-centre", "staffing", "survival-analysis", "simulation", "selection-bias", "retrials"]
expert_time_estimate_hours = 7
relevant_experience = """
I have worked as a workforce planning analyst for inbound contact centres running Asterisk based PBXs, building half hourly staffing plans from queue_log and CDR data, including handle time modelling with wrap up and after call work, abandonment and patience estimation, and checking plans against service level targets.
"""

