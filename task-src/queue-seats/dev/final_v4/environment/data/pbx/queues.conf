; queues.conf - customer service queues, pbx01
; copied from /etc/asterisk on pbx01 (etckeeper) 2027-02-24

[general]
persistentmembers = yes
autofill = yes
shared_lastcall = yes
log_membername_as_agent = no

[cs-common](!)
strategy = rrmemory
timeout = 15
retry = 2
ringinuse = no
autopause = no
joinempty = yes
leavewhenempty = no
announce-frequency = 30
announce-position = yes
announce-holdtime = no
periodic-announce-frequency = 0
servicelevel = 20
musicclass = default

[billing](cs-common)
wrapuptime = 15

[moving](cs-common)
wrapuptime = 30

[faults](cs-common)
; 2027-02-22 CHG-4471 raised from 20 so field notes get typed before the next call
wrapuptime = 60
