; extensions.conf (excerpt) - inbound customer service, pbx01

[from-carrier]
exten => _X.,1,NoOp(inbound ${CALLERID(num)})
 same => n,GotoIfTime(08:00-19:59,mon-fri,*,*?ivr-main,s,1)
 same => n,GotoIfTime(09:00-16:59,sat,*,*?ivr-main,s,1)
 same => n,Playback(cs-closed)
 same => n,Hangup()

[ivr-main]
exten => s,1,Answer()
 same => n,Background(cs-welcome)
 same => n,WaitExten(6)
exten => 1,1,Goto(queues,6001,1)
exten => 2,1,Goto(queues,6002,1)
exten => 3,1,Goto(queues,6003,1)
exten => t,1,Goto(queues,6001,1)

[queues]
; agents blind transfer into this context (feature map atxfer/blindxfer, context queues)
exten => 6001,1,Queue(billing,t)
 same => n,Hangup()
exten => 6002,1,Queue(moving,t)
 same => n,Hangup()
exten => 6003,1,Queue(faults,t,,,600)
 same => n,Playback(cs-faults-callback)
 same => n,VoiceMail(9003@cs,s)
 same => n,Hangup()

[agents]
; agents log in and out with *45 / *46 (AddQueueMember / RemoveQueueMember)
; *47 pauses with a reason code: Break, Lunch, ACW. *48 unpauses
exten => *45,1,AddQueueMember(${ARG1},PJSIP/${CALLERID(num)})
exten => *46,1,RemoveQueueMember(${ARG1},PJSIP/${CALLERID(num)})
exten => *47,1,PauseQueueMember(${ARG1},PJSIP/${CALLERID(num)},,${ARG2})
exten => *48,1,UnpauseQueueMember(${ARG1},PJSIP/${CALLERID(num)},,${ARG2})
