artifacts = ["/app/out/recovered.tar", "/app/out/lost.txt"]

[task]
name = "afterquery/raid-salvage"

[metadata]
author_name = "Shaswat Panda"
author_email = "pandashaswat712@gmail.com"
difficulty_explanation = "This is a data recovery engineer's job done twice over: put a dead Linux md raid5 back together in userspace from GNU ddrescue 1.27 images, then recover the ext4 filesystem on it the way the kernel would have on the next mount, and say exactly which files the evidence pins down. The md layer (mdadm 4.2, v1.2 superblocks, internal write intent bitmap) is the entry fee. bay4 was kicked in early September and re added, and it carries the same event count (18742) as bay1 and bay3, yet it is only current below its Recovery Offset (7096 sectors) and in bitmap chunks the bitmap left clean. bay2 failed at the recovery front and is two events behind (18740), but its data is current apart from its holes. Unread space is every mapfile status other than '+', including the non scraped and non trimmed areas of the interrupted bay2 run. Both bay1 and bay2 have holes, so on some rows two members are unknown even below the front. The textbook rule is not the end of it. Above the front, bay4 holds the array exactly as it was when it dropped out, which kern.log on the share dates to Sep 2 05:12:41 local time. A block owned by a file whose inode ctime is before that cannot have changed since, because any write or reallocation moves ctime, so bay4's copy of it is current although the 64 KiB bitmap chunk is dirty. If bay4 holds parity on a row where all three data sectors are such blocks, the parity is current too. That lets bay2's unread sectors be rebuilt through parity on rows that every textbook reading writes off, and three files come back that way, two drawings through a data sector and the sparse vm image through a parity sector. The proof needs the owner's inode and extent tree, so the md and ext4 layers have to be iterated to a fixpoint. The counter traps keep the argument honest. A drawing restored from backup with rsync -a in the degraded month has a 2024 mtime but a September ctime, and its blocks on bay4 are stale, so trusting mtime hands back wrong bytes. Anything written after the drop, including in the degraded month before the re-add, cannot be trusted on bay4. The hard part is the filesystem. The array went down hard during the rebuild, so ext4 has needs_recovery set and four jbd2 v3 transactions sit in the log: three committed, one revoke only transaction among them, and an uncommitted tail that moves a file into a new folder and appends to a log. The share as it was is what journal recovery gives. The raid losses land on metadata as well as data, and each has a different consequence. Lost sectors of an inode table block that a committed transaction rewrites cost nothing, because recovery replaces the block, and the ten files whose inodes sit there must be handed back. Lost sectors inside the journal copy of an inode table block cost exactly the inodes in those 512 byte sectors (five photos copied in that transaction), not the whole 4 KiB block. e2fsck's own replay notices the bad tag checksum, keeps the stale in place block and carries on, so trusting it hands back wrong files. Lost in place inode table sectors with no journal copy cost two inodes each, 14 files here. Those files then show a zeroed inode and are only identifiable as regular files from their directory entries. A lost sector in the extent leaf of a fragmented drawing costs that file although every data block is intact. 16 lost sectors fall in the unwritten extents of a preallocated image and cost nothing, because unwritten extents read as zeros. Block 10340 was an extent leaf logged in the first transaction and revoked when the temp image was deleted, and it is now data of /it/logs/nfsd.log, so a replay that ignores the revoke corrupts that log. Running e2fsck -fy on the reconstructed array clears the zeroed inodes and makes files vanish from both outputs. Each of these readings was run against the case and each one fails the grade: the textbook currency rule without the ctime argument, the ctime argument done with mtime, force assembly, dropping bay4, bitmap only, offset only, '-' only as unread, no replay, ignoring revokes, replaying the uncommitted tail, keeping the old block on a bad copy, losing whole inode table blocks, treating unwritten extents as data, ignoring extent blocks, trusting a zeroed inode, and keeping in place losses after replay. The data is synthetic but built with the real tools and formats. The share's three year history was written into a real ext4 image with e2fsprogs 1.47.0 debugfs. The jbd2 transactions were written with debugfs journal_write and recovered with e2fsck to check that recovery gives the true share. A generator then laid the filesystem out as a 4 member left symmetric raid5 with 64 KiB chunks and wrote v1.2 superblocks, the internal bitmap and the ddrescue mapfiles in the exact on disk and text formats mdadm 4.2, ddrescuelog and debugfs read. The 27 lost files out of 142 were checked by filling every undetermined byte with junk three times, replaying, and reading every file back with debugfs: exactly those 27 change. On every row the ctime argument trusts, bay4's bytes were checked to equal the true array."
solution_explanation = "solve.sh unpacks the four images and runs recover.py. md: each member is read with mdadm --examine (role, data offset, chunk, layout, events, recovery offset, bitmap offset). The internal bitmap is cut out of an in sync member's image (mdadm -X reads a plain file as an external bitmap) and decoded for its dirty chunks. All four mapfiles become unread sector lists with ddrescuelog --list-blocks over every status other than '+'. Per member row the unknown members are the unread ones plus the recovering member where it is stale (at or above its recovery offset in a dirty chunk). With one unknown the row is rebuilt by xor, and with two or more the data sectors of the unknown members are recorded as undetermined while the array image is rebuilt. ext4: geometry comes from debugfs -n stats, because dumpe2fs refuses a bitmap whose checksum fails. The journal's block map comes from debugfs ex <8>, and the log from debugfs logdump -a. Committed transactions are replayed in sequence order, a revoke record with sequence s cancelling copies from transactions up to s, and the uncommitted tail is ignored. A replayed block takes its bytes and its undetermined sectors from its journal copy, and its in place losses no longer matter. The directory tree is walked by parsing directory blocks directly, so a regular file whose inode is undetermined is still found by its entry's file type. A file is lost if any byte of its own 256 byte inode, any extent index or leaf block, or any initialized data byte below i_size is undetermined. Unwritten extents and holes are ignored. Then the drop time is read from the md failure line in kern.log. Above the recovery offset, in dirty chunks, bay4 is trusted on every row where its sector lies in a block of a file whose ctime is at least a day before the drop, or where it holds parity and all three data sectors do. The day of margin covers the log's unknown time zone and writeback delay, and no ctime on the share falls within it. The array is rebuilt with those rows trusted and analysed again, and this repeats until the trusted rows stop changing. Every regular file left determined is dumped by inode with debugfs into recovered.tar under each of its paths."
verification_explanation = "The verifier image holds the sealed state of the share (truth.json: every regular file path with its size and sha256, and the exact set of paths that the four images cannot determine). It was computed by the generator from the true filesystem and its on disk crash state, and cross checked by replaying junk filled variants with debugfs. It reads /app/out/recovered.tar and /app/out/lost.txt only and runs no agent code. It checks that the tar holds only regular files with clean paths and no duplicates, that every regular file path of the share is in exactly one of the two outputs and nothing else is, that no undeterminable file is in the tar, that lost.txt names exactly the undeterminable files, and that every file in the tar matches its true sha256. Reward is 1 only if every check passes. Sixteen wrong readings of the md and ext4 layers were run against the case, and each one fails it."
category = "Software"
subcategory = "Systems"
tags = ["mdadm", "raid5", "ext4", "jbd2", "debugfs", "ddrescue", "data-recovery"]
expert_time_estimate_hours = 9
relevant_experience = "I have recovered data from failed Linux md arrays for small offices, including raid5 sets that dropped a second disk during a rebuild, working from ddrescue images because the original drives were too far gone to keep powered. That meant reading v1.2 superblocks and write intent bitmaps by hand to decide which member was current where, rebuilding stripes from parity in userspace, and pulling files out of ext4 with debugfs while deciding which ones could honestly be handed back, including filesystems that went down mid transaction where the jbd2 log had to be read and replayed by hand because e2fsck's own recovery would have thrown away what was left."

