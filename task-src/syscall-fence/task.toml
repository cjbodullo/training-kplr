artifacts = ["/app/filter.bpf"]

[task]
name = "afterquery/syscall-fence"

[metadata]
author_name = "Shaswat Panda"
author_email = "pandashaswat712@gmail.com"
difficulty_explanation = "This is the work of a security engineer who has to sandbox an untrusted program with seccomp-BPF without breaking it. You are handed a compiled program (/app/target) that does ordinary read-and-summarise work but, on some inputs, tries to tamper with the machine, and you must deliver a raw struct sock_filter[] seccomp program (the exact bytes the kernel loads through SECCOMP_MODE_FILTER) that stops every tamper while leaving the normal path working. The difficulty is not transcription: there is no syscall table to copy. You must reverse engineer the target with strace and reasoning to learn exactly which syscalls its real work needs, then realise that a seccomp program sees only syscall numbers and scalar arguments, never the path strings behind the pointers. That single fact is what makes it hard. The target both reads files and, on a tamper, writes files, and both go through openat, so you cannot allow or deny openat by number, you have to split it on the open flags (reject O_WRONLY/O_RDWR/O_CREAT, allow O_RDONLY, and mask correctly so O_CLOEXEC on a read does not look like a write). openat2 cannot be split this way at all, because its flags live in a struct behind a pointer seccomp cannot dereference, so it has to be denied outright. And the tamper surface is a whole family, not one call: file creation and writing (openat, open, creat, openat2), delete and rename and link (unlink, unlinkat, rename, renameat, renameat2, link, linkat, symlink, symlinkat), directory creation (mkdir, mkdirat), running other programs (execve, execveat, which keep the filter across the exec), and permission and ownership changes (chmod, fchmod, fchmodat, chown and friends). Miss one member of one family and that tamper gets through; over-block the read side and the legitimate summary breaks. The target is real, compiled and stripped, so the whole thing is reverse engineering a live binary and reasoning about seccomp's blind spots, not filling in a given spec, with a slow edit-build-run loop in raw classic BPF. The target and all data are synthetic, written for this task; nothing is captured from a real system."
solution_explanation = "The reference (solution/gen_filter.c) builds the program with a small two-pass label assembler so jump offsets are computed, not counted, then writes /app/filter.bpf; solve.sh compiles and runs it. The policy defaults to ALLOW, so the target's read-and-summarise path (openat O_RDONLY, newfstatat, read, close, mmap, munmap, brk, getrandom, clock_gettime, write to stdout, exit) is untouched. It then denies the tamper families. openat and open are sent to a small handler that loads the flags argument (arg2 for openat, arg1 for open) and returns EACCES when any of O_WRONLY/O_RDWR/O_CREAT is set, else allows -- so reads pass and write/create opens fail. openat2 is denied outright because its flags are behind a pointer. creat, the rename/unlink/link/symlink/mkdir/rmdir/mknod/truncate family, execve and execveat, and the chmod/fchmod/fchmodat/chown family all return EACCES. Returning an errno rather than killing lets the target keep running and still print its summary on the mixed benign-plus-tamper inputs. The key insights are the path-blindness of seccomp (split openat by flags, deny openat2 outright) and covering every member of each tamper family rather than the obvious one."
verification_explanation = "The target program (tests/target.c, sealed and compiled into the verifier image, with a byte-for-byte equivalent shipped stripped to the agent) installs the agent's /app/filter.bpf on itself at startup with NO_NEW_PRIVS + SECCOMP_MODE_FILTER, then runs a job file. The grader (tests/test_fence.py) runs the target under sealed jobs and checks real effects on the filesystem, never agent-written claims; the agent supplies only filter bytes, and the grader runs its own sealed target. Four benign jobs must exit 0 and print the exact summary (sum and file count computed from the sealed data), which forces the filter not to break the read path -- a filter that blocks openat wholesale makes these fail. Eleven tamper jobs must leave the filesystem untouched: the write/create vectors (openat with write flags, creat, openat2) must not produce a file containing the secret bytes; rename and unlink must leave the guard file in place; symlink and mkdir must not create their targets; chmod and fchmodat must leave the guard file's mode at 0644; and the two exec vectors run a helper that signals it ran purely through exit code 42 (which survives any filter, since seccomp persists across execve), so the only way to pass is to block execve/execveat themselves. A tamper may be stopped with an errno or by killing the process; either passes as long as the effect is absent. Reward is 1 only if every benign and every tamper check passes. Verified locally: the reference scores all checks, doing nothing (no filter) fails all eleven tamper checks, a filter that blocks openat entirely fails the benign checks, and a filter that only handles openat write-flags lets the other families through. test.sh writes /logs/verifier/reward.txt (0 or 1) and a CTRF report on every path."
category = "Security"
subcategory = "AppSec"
tags = ["seccomp", "bpf", "linux", "sandbox", "reverse-engineering", "strace"]
expert_time_estimate_hours = 5
relevant_experience = "I have built seccomp-bpf sandboxes for running untrusted and third-party code, where the job was exactly this: take a program I did not fully trust, work out from strace and disassembly which syscalls its legitimate work actually needs, and write a filter tight enough to stop it writing files, spawning processes or changing permissions while still letting it run. That meant living with seccomp cannot see paths, so splitting openat by its flags to allow reads but refuse writes and creates, denying openat2 outright because its flags sit behind a pointer, and covering whole families (every rename, unlink, link, mkdir and chmod variant, execve and execveat) rather than the one call that first came to mind, then confirming the installed filter under NO_NEW_PRIVS by driving the real program."

