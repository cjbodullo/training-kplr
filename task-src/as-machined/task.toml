[task]
name = "afterquery/as-machined"

[metadata]
author_name = "Shaswat Panda"
author_email = "pandashaswat712@gmail.com"
difficulty_explanation = """In industry this is a manufacturing or quality engineer doing a forensic virtual machining study: a customer rejected a lot, the CAD is gone, and the question is what the old Fanuc 0i-MF machining centre actually cut on the day the lot ran (2026-09-18). The agent gets the control backup taken today (ALL-PROG.TXT punch with custom macro B, CNC-PARA.TXT, TOOLOFST.TXT memory C offsets, EXT_WKZ.TXT work offsets), the operation history export OPRT-HIS.TXT, PC-DMIS CMM reports of three serials per part from that lot, and the shop's tool crib sheet, vise data and setup sheets, and must deliver STEP solids of the three parts as cut that day within 0.02 mm, including every feature the CMM never measured. The history wrapped and starts 2026-09-24, so logged changes must be undone in order (EXT Z, H3 and D7 wear, and parameter 3401#0 DPI, which was 1 on the lot day, so a spotface typed Z-6 was cut 6 mm deep), with decoys mixed in. What the history cannot reach is diagnosed from the CMM data: every BRG-1140 feature sits 0.3 mm off in X (G56 re-touched before the history starts); holes measure 6.8 not 6.6, so the old 118 degree drill from the crib sheet's 09-22 note was in the spindle. The hard part has no numeric residual to lean on. With that longer drill and the program's G43 H5 call on T6, the drill point sits 0.05 mm below the MNF-0610 back face at the G99 R plane, so the rapids between holes drag it across the face and leave scratch lines: a model that treats G00 as non-cutting is wrong by about 0.05 mm, more than twice the tolerance. And the MNF-0610 back side was loaded turned over about Y, against the setup sheet, but every measured back side feature is symmetric under both turnovers; the only evidence is the inspector's visual note on where the scratch lines run, which an agent can use only if it understands where they come from. The turnover decides the position of the unmeasured counterbore and of the scratches. Under all that sits exact Fanuc execution (M98 sharing locals so one of four commented counterbores is cut, G52 replacing, vacant macro arguments, G91 canned cycle R/Z with K, M99 keeping G91 so a hole is drilled in air, G51.1 arc reversal, G68, cutter compensation with wear) and swept tool geometry (drill points, chamfer mill tip, a bull nose ridge, a pocket macro whose sharp cornered roughing gouges its own R8 corners). Probe history: a forward-only version was solved in minutes; a version where every hidden change showed in the CMM residuals was solved 3 of 3 at default effort because the reports served as an oracle; this version moves the decisive inferences off the oracle. The parts, programs, history and measurements are synthetic, written for this task; the file formats, the control semantics and the tooling are real."""
solution_explanation = """Roll the backup back with the history: walk OPRT-HIS.TXT newest first and restore every logged old value after 2026-09-18, checking that each entry chains onto the current value; confirm none of the programs used was edited. Forward model: a Fanuc 0i macro B interpreter (local levels for G65 not M98, vacant arguments, DPI per 3401#0, modal state through M99, G52, G68, G51.1, G43 geometry+wear of the H called and the real length of the tool loaded, type A cutter compensation, R and IJ arcs, canned cycles with G91 and K) feeding exact OCCT swept volumes for every move that reaches material, rapids included (1401#1 LRP = 1, straight line positioning), cut from stock located by the vise data. Measure the modelled parts like the QC program (datum A bottom, B front, C left) and compare with the averaged CMM serials: only the old T6 (6.8, 118 degree point, 126.690 long, H6 still holding that length) reproduces the measured diameters and blind hole depths; the BRG residuals are a common X offset of +0.300, applied to G56. Both MNF OP20 turnovers fit every measured number to 0.002; the scratch lines the modelled part carries on datum A match the inspector's note (one run along Y about 12 from datum C) only for the turnover about Y. Export the three solids. The reference (solution/history.py, fanuc.py, cut.py, cmm.py, parts.py, models.py) runs in about five minutes."""
verification_explanation = """For each of the three parts the verifier reads /app/models/<part>.step with OCCT (cadquery-ocp) and compares it with the sealed lot-day solid. Gates, in order: exactly one solid that passes BRepCheck; volume within 1e-4 of the sealed one; the 24 proper axis rotations (no reflections) filtered by bounding box sizes to 0.05 mm, translated so the boxes coincide, smallest symmetric difference kept; that non-overlapping volume below 2e-4 of the sealed volume; a 5 by 5 parametric grid of points on every face of both solids within 0.02 mm of the other solid's boundary. All three parts must pass for reward 1; one pytest test per part feeds the CTRF report. How the truth was made and checked: the sealed solids come from an explicit lot-day state kept apart from the solver (dev/state0918); the reference solver, given only what the agent gets, reconstructs it (history rollback matches exactly, G56 shift fitted to +0.300, old T6 selected, Y turnover selected by the scratch note) and reproduces the sealed solids with volume difference 0, symmetric difference 0 and deviation 0; an independent point classifier that decides analytically whether a point lies inside any tool position along any move agrees with OCCT on 18000 random points, 12000 points near features and 3000 points in the scratch layer (838 of them inside the grooves), zero mismatches; the CMM reports were measured off the sealed solids with 1.5 micron noise. A battery of 19 wrong reconstructions rebuilt with the same engine all score 0, among them: today's state, today's state patched with the CMM-visible fixes, DPI, EXT, H3 or D7 not rolled back, the G56 shift missed, today's T6, the old T6 with today's H6, OP20 turned over about X as the setup sheet says (symmetric difference 778 mm3), rapids treated as non-cutting (fails the surface gate at 0.045 mm with volume and symmetric difference inside their gates), six control semantics misreadings and the bull nose as a flat endmill. The one per part pass in it (old T6 with today's H6 on MNF-0610) is correct, since O1620 calls H5 there; that reading fails BRG-1140 and LVR-2205. Four lazy submissions in cheat/ and an empty output score 0."""
category = "Hardware"
subcategory = "CAD"
tags = ["cnc", "fanuc", "gcode", "macro-b", "step", "cadquery", "virtual-machining", "cmm", "pc-dmis"]
