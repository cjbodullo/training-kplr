relevant_experience = """I have worked as a CNC programmer and manufacturing engineer on Fanuc controlled vertical machining centres, writing and debugging custom macro B programs, setting work and tool offsets, proving out programs in Vericut, and chasing rejected parts back to offsets, parameters and hand edits on the control."""

