[task]
name = "afterquery/mcp-signoff"

[metadata]
author_name = "Shaswat Panda"
author_email = "pandashaswat712@gmail.com"
difficulty_explanation = "This is timing constraint signoff work: produce the complete, provably safe set of multicycle exceptions for a frozen gate level netlist, the job that commercial exception generators and formal constraint verifiers do in a production flow. The block is a 3 stage CIC decimator with a 4 phase gain scaler, peak and level meters and an APB register file, mapped by yosys 0.23 onto sky130 hd cells (459 flops, edfxtp enable flops for the datapath), timed with OpenSTA 2.7.0. The rule is precise: a path from flop S to a data pin may take setup multiplier N only if S's output has held its value for N cycles on every reachable cycle where that pin captures, with the edfxtp DE pin deciding capture, DE pins and plain flops capturing every cycle, and no credit for logic masking. Every one of the 11614 timed path ends has to come out exactly right, so the answer is a reachability question over the whole design, not a reading of the designer's intent. The design intent is misleading on purpose in the ways real blocks are. The comb cascade looks like a ratio 4 decimated path and the scaler like a 4 phase sequencer, but a production test mode behind a two word KEY sequence turns ratio code 3 into decimate by 2, which drops the comb, sample index and multiplier paths to 2 and the commit and index paths into the operand register to 1. Its TEST preload is guarded by not busy, yet a preload in the same cycle as a start slips through and enters phase 1. An idle channel skip fires only when the 27 bit comb output is exactly zero, which random stimulus never produces, and it takes the output tag path to 1. Free running copies (gain_q, opx_q) have no enable but are legal multicycle sources because their value only changes a cycle after their source, AGC splits the gain copy so its fine bits take 1 and its coarse bits 2, the peak meter shares a source between its D pin (2) and its DE compare (1) so a cell level exception is wrong, and clear on read makes the level accumulator single cycle. The dump on sync and the input stall watchdog both look like they shorten the decimation spacing, but neither brings it below the 2 cycles test mode already allows (the watchdog resets the count when it flushes). Each wrong reading was run through the verifier and fails it: design intent multipliers (comb 4, scaler 3, tag 4) 4276 wrong path edges, an exhaustive answer that ignores test mode 3149, a random simulation answer that never sees an exactly zero comb output 3, treating the whole gain copy as one register 8, cell level instead of pin level destinations 187, enable based instead of value based stability (dropping gain_q and opx_q exceptions) 189, setup without the matching hold 4268, and an empty file 4268. Most of these wrong sets still meet timing, so the STA run is no oracle. Data provenance: the RTL was written for this task and is synthetic; the netlist is its real yosys and abc mapping onto the sky130 hd typical library that ships with OpenSTA. The ground truth was produced by formal model checking of that netlist (abc pdr over an AIGER export of the liberty cell functions), proved in both directions for every pair, and is independent of how pre power up windows and unreset power up values are read."
solution_explanation = "Enumerate every flop to pin path with OpenSTA. Export the frozen netlist to AIGER through yosys read_liberty so the real cell functions are used, exposing every flop Q and every edfxtp DE net, with rst_n low on cycle 0 only and unreset flops free at power up. For every DE net g and every flop S that reaches a D pin enabled by g, ask abc pdr whether g high implies S unchanged over the last k cycles, starting from a cap of 7 and lowering k for every disproved pair until all remaining properties are proved, then confirm k+1 is disproved for each. The largest legal multiplier is k+1 for that D pin path. DE pin paths, plain flop endpoints and io paths stay at 1. Emit set_multicycle_path k+1 -setup and k -hold per source flop to the exact D pins. The reference runs in a few minutes and gives 4268 paths at N=2 and everything else at 1; with it the block meets the 5.5 ns clock (setup WNS +0.15 ns, hold +0.23 ns) where no exceptions leave it at -0.75 ns."
verification_explanation = "The verifier reads only /app/exceptions.sdc and runs no agent code. It parses the file against a whitelist grammar (set_multicycle_path or set_false_path with -setup/-hold/-start/-end, -from/-to over get_cells or get_pins with plain name globs, no tcl characters) and re-emits a canonical sdc, so nothing the agent wrote is executed by Tcl. OpenSTA 2.7.0, built from the same pinned source as the agent image, loads the sealed copy of the netlist, the sky130 lib and base.sdc, then the canonical exceptions, and reports for every timing path from every flop and every input the setup capture edge and the hold edge (target clock time plus multicycle adjustment, in clock periods). That table must equal the sealed expected.json exactly: 11614 setup edges (7346 at 1, 4268 at 2) and 11614 hold edges at the launch edge, with no path missing or added. The block must also meet timing with the file, which the right answer does. Reward is 1 only if every check passes. expected.json is generated by tests/ground_truth from formally proved stability bounds (README there), and the reference sdc reproduces it with 0 mismatches. The empty file and eight wrong readings listed in the difficulty explanation each fail."
category = "Hardware"
subcategory = "RTL"
tags = ["sta", "opensta", "sdc", "multicycle-path", "formal", "yosys", "sky130"]
expert_time_estimate_hours = 10
relevant_experience = "I have worked as a digital implementation engineer writing and signing off SDC for ASIC blocks, including multicycle and false path exceptions for enable gated datapaths and register files. Part of that job was reviewing exception lists against RTL, chasing silicon escapes caused by multicycle paths that a test or debug mode broke, and using formal tools to prove that a source register is stable before a capture enable fires."

