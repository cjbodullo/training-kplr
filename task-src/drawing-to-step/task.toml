[task]
name = "afterquery/drawing-to-step"

[metadata]
author_name = "Shaswat Panda"
author_email = "pandashaswat712@gmail.com"
difficulty_explanation = """In industry this is the job of a mechanical CAD designer or CAD technician who digitises legacy vendor prints into 3D so a CNC programmer and the spares supplier can work from a model. Six hand-drawn, not-to-scale prints (the drawn geometry is distorted by up to 60 percent per feature, a dimensioned 10 is drawn 16) arrive the way a raster-to-vector pass over the scans delivers them: AutoCAD R2013 DXF with a single layer and polylines only. Circles and arcs are sampled, hidden lines are real dash segments, centre lines are long-short chains, hatching is drawn 45 degree lines, arrowheads are closed outlines, the sheet carries a slight scan skew and vertex jitter, and every letter, digit and symbol, title blocks, notes and the hole chart included, is glyph outline geometry. There are no dimension entities, text strings, layers or linetypes to parse, nothing can be measured, and re-projecting a model onto the views cannot confirm a value. Each value has to be read visually off the sheet and tied to its feature through extension lines, leaders, section traces, detail circles and view arrows. The sheets do not share a convention, and the features that decide pass or fail are defined through drafting constructs that have to be interpreted rather than read: BRK-2210 is ISO first angle (a third angle reading mirrors the part), its offset section B-B along a stepped cutting plane is the only place that gives the counterbore depth and the 16 wide, 4 deep counter-slot above the slot, and two dowel holes are drilled from the far side; FLG-0417 is third angle with five holes and an aligned section A-A along a bent cutting plane (the section shows two holes as if they were diametrically opposite although they sit 144 degrees apart, so a model that reproduces the section literally is wrong), the O-ring groove profile only in an enlarged DETAIL A (bottom width 5 on diameter 80, depth 2.5, 5 degree draft on both sides, R0.4 corners) and a keyway given as 28.3 over the bore; HSG-3305 is an inch print with a third angle bottom view whose Y runs the other way, a 30 degree face, and a partial auxiliary VIEW C rotated along the face normal that alone locates port B and two 1/4-20 tapped holes drilled normal to the slope; SHF-1150 is a first angle broken view (the 480 overall exists only as text) with a TAPER 1:10 stated by the ISO 3040 symbol and the large end diameter only (the small end, 21, is derived), a removed section B-B for the keyseat, a removed section C-C giving a flat as 32 across, a DIN 471 groove located from one flank and a cross hole whose clocking comes from which view shows it as a circle; CVR-5120 is third angle with an ordinate hole chart from a datum at the intersection of rounded edges, countersinks of which two are FAR SIDE, M6 holes tapped from the bottom, an underside rabbet seen only in the side view and the general note ALL UNDIMENSIONED RADII R3 that applies to an inside corner shown only as an arc; BKT-3302 has no print of its own: sheet BKT-3300 shows the right hand BKT-3301 and a note makes BKT-3302 the opposite hand (mirrored, a model of the drawn hand cannot match), its 8 mm hole runs at a compound angle given only as two projected angles that have to be combined into the true axis, the same R3 note covers an undimensioned notch corner, and two dowel holes in the underside are located only in an unlabelled view from below which, this being first angle, sits above the elevation with its depth axis reversed (read as a plan view it puts the dowels in the wrong places). Tapped hole callouts give a thread depth that differs from the drill depth, and only the drill depth belongs in the solid. About 95 features across the six parts, all or nothing, 0.02 mm on every surface, and the original solids are sealed, so a single misread hole depth, mirrored view, unconverted inch, missed general-note radius, wrong taper ratio or a hole located along X instead of along the slope fails silently. The parts, prints and vendors are synthetic, generated for this task with OCCT hidden line removal and ezdxf and then passed through a scan-vectoriser emulation; the drafting conventions are the real ISO and ASME ones."""
solution_explanation = """Read each title block first: projection method (symbol and text), units and the not to scale note, then every general note. Identify the views from the projection method (first angle: plan below and left view right; third angle: plan above, bottom view below with Y reversed), find the section traces, detail circle and view arrow, then attach every dimension, leader, note and chart row to its feature through the view geometry and take values only from the lettering. Build each part in CadQuery: BRK-2210 base, upright at the back, right hand gusset, R6 fillet, 2x45 and 5x45 chamfers, 52 bore, M5 tap drills 4.2 deep 10 on PCD 63 at 45 degrees, 4 counterbored holes at their individual coordinates with the cbore 6.8 deep from section B-B, R5 slot 20 centres with the R8 counter-slot 4 deep from the same section, 2X 5 H7 dowels 8 deep from the bottom face at 35/50 and 85/20; FLG-0417 flange, hub, R3, 1x45, 25 bore, 40x6 counterbore, 8 wide keyway with bottom at 28.3 from the far side of the bore, 5x11 on PCD 110 starting at 18 degrees from the keyway centre line (the bent trace of section A-A passes through the holes at 90 and 234 degrees; the section is drawn aligned and must not be used for hole positions), and the groove from DETAIL A: revolve a trapezoid whose theoretical bottom corners sit at r 40 and 45 on z 2.5 with both sides leaning 5 degrees outward to the mounting face, then fillet the two bottom corners R0.4; HSG-3305 converted from inches, 30 degree face from 2.250, stepped port A, cross hole, four .201 tap drills .500 deep, from VIEW C port B .250 x .500 at .400 down the slope on the centre line and two .201 x .500 drills at .650 down the slope, .375 and 1.625 from the front face, all three along the face normal, pocket from the bottom view with Y measured from the front edge; SHF-1150 lengths 40 / 140 / 15 / 480 / 25 from text across the break, the left 40 as a cone from diameter 21 at the end to 25 at the shoulder (1:10 on the diameter), 1.5 chamfer on the right end only, keyseat 8 x 50 round ends 60 from the left end with bottom 26 over the underside from section B-B, the flat 10 from the collar, 30 long, its plane 32 above the underside from section C-C, groove 33 x 1.6 with its right flank 10 from the 35/30 step, 6 thru 12 from the right end along Y; CVR-5120 plate 160 x 110 x 12 with R10 corners, A1-A4 6.6 thru with 90 degree countersinks to 13 from the top, A5-A6 the same countersink from the bottom, B1-B2 M6 drill 5 deep 10 from the bottom, C1 40 thru with an 80 x 4 recess, all at chart coordinates, the 8 x 4 underside rabbet along the back edge with its inside corner filleted R3 per note 4; BKT-3302: find it on sheet BKT-3300, model the drawn BKT-3301 (70 x 50 x 20 base, 30 wide tower to 45 with 6x45, 10 x 12 x 8 notch with its vertical inside corner R3 per note 4, R4 slot 16 c-c at 55/25, 2X M4 drill 3.3 deep 10 in the right face, 2X 4 H7 dowels 6 deep from the bottom face at 20/10 and 45/40 taken from the view from below (first angle: above the elevation, Y reversed), 8 thru entering the tower top at 12/18 with axis direction (tan 20, tan 20 tan 30, -1)) and mirror it for the opposite hand. Tapped holes everywhere use the drill depth, not the thread depth. Export one solid per STEP in mm."""
verification_explanation = """For each of the six parts the verifier reads /app/models/<part>.step with OCCT (cadquery-ocp) and compares it with the sealed original solid. Gates, in order: the file must load and contain exactly one solid that passes BRepCheck; its volume must be within 1e-4 of the original; then the 24 proper axis-aligned rotations are tried (no reflections, so a mirrored part cannot match), each candidate is kept only if its bounding box matches the original's in all three sizes to 0.05 mm (a cheap pre-filter: an inch/mm confusion or a wrong overall size never reaches the booleans; 4 or 8 orientations survive for a correct model depending on the part's symmetry), the candidate is translated so the boxes coincide and the one with the smallest symmetric difference is kept; that non-overlapping volume must be below 2e-4 of the original; finally a 5 by 5 parametric grid of points on every face of both solids (525 to 1250 points per part) must each lie within 0.02 mm of the other solid's boundary (the compound of its faces, so a point that falls inside the other solid because material was cut away there still counts as off-surface; sampling stops early once 0.2 mm is exceeded). Non-finite values fail. All six parts must pass for reward 1, otherwise 0; one pytest test per part feeds the CTRF report. How the numbers were chosen: the parts are nominal CAD geometry, so any correct construction reproduces the original to floating point, and that is measured, not assumed. The reference models (built by an independent script from the dimension lettering) score volume difference 0, symmetric difference 0 and deviation 0 on all six, and rotated plus translated copies of the originals score volume difference below 2e-14, symmetric difference 0 and deviation 0, more than ten orders of magnitude under the gates. On the other side a battery of 65 wrong readings built from the generator fails on every one (dev/misread_margins_v9.txt): six mirror or hand mix-ups (first/third angle, the drawn hand instead of the opposite hand, a view from below read as a plan) and 59 single-feature misreads: a chamfer 4 instead of 5, a tap drill at thread depth instead of drill depth, drill .213 instead of .201 inch, a hole 10 mm off, holes clocked to 0 instead of 18 degrees, the flange holes placed where the aligned section shows them, a groove located from the wrong flank, the compound hole angle taken as two rotations, the counter-slot missed or 3 deep, the groove draft or the R0.4 corners omitted, the taper as 1:20 or applied to the radius or reversed, a chamfer added on the tapered end, the flat on the other side or 35 long, the auxiliary-view holes placed .650 along X instead of along the slope or drilled vertically, dowels missed, 8 instead of 6 deep or drilled from the top, the FAR SIDE countersinks from the top, a general-note R3 fillet missed or made R2. Every one of them deviates by at least 0.105 mm on the surface (5 times the gate; most by 0.2 to 4.5 mm), and three of them (the missing R0.4 corners, R2 instead of R3 at the bracket notch, the added chamfer) are caught by the surface gate alone, their volume and symmetric-difference ratios being below those gates, which is why the surface gate measures to the boundary. One variant in the battery (hole chart origin taken at the opposite edge of a symmetric pattern) produces a solid identical to the original and correctly passes. 0.02 mm sits below the smallest value increment on any sheet (0.1 mm, .005 inch) and above STEP round-trip precision (1e-6 mm); the two volume gates are sample-free, so a feature that happened to fall between grid points would still fail them, since 1e-4 of the smallest part is 10 mm3 and the smallest feature in the battery removes or adds 32 mm3."""
category = "Hardware"
subcategory = "CAD"
tags = ["cad", "cadquery", "dxf", "step", "engineering-drawings", "reverse-engineering"]
expert_time_estimate_hours = 5
relevant_experience = """I have worked as a mechanical design engineer modelling parts from supplier and legacy drawings for machining and spares, reading ISO first angle and ASME third angle prints, inch and metric, section views and hole callouts, and checking the resulting models before they went to CNC programming."""

