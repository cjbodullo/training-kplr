artifacts = ["/app/kestrel.gguf"]

[task]
name = "afterquery/kestrel-gguf"

[metadata]
author_name = "Shaswat Panda"
author_email = "pandashaswat712@gmail.com"
difficulty_explanation = "This is the job of the on-device ML engineer who owns shipping a research checkpoint into an inference runtime they are not allowed to change, after the training code is gone. Two hard parts compound. First, the forward pass has to be reconstructed from evidence. The run dir holds a kite-framework checkpoint with a fused, group-packed qkv tensor, a fused MLP input, and a train_config.yaml written in kite's own vocabulary ('qkv: fused_grouped', 'attn_temperature: inverse_d', 'rotary: {pct, theta, interp_factor, cache_dtype}'). The only record of how the code behaved is 24 regression transcripts: greedy completions as token ids, 8 of them on 800 to 1800 token prompts, with no logprobs. Several conventions are not stated anywhere and must be recovered from the transcripts. They are how each kv group packs its query heads, keys and values; which query head reads which kv head (tiled, h mod n_kv); the up/gate order of the fused MLP; that rotary acts on the first 16 of 32 head channels in half-split layout; that its frequencies are spaced over the full head dimension rather than the rotary width; and that inverse_d means 1/d_head. One fact cannot be checked against the transcripts at all. The config's 'rotary.cache_dtype: bfloat16' means kite held inv_freq in bfloat16, so every angle uses rounded frequencies. That never flips a greedy token in any transcript, but it moves the angles by up to radians at the 2048-token positions the grading uses. It has to be inferred from the config line alone, and its exact form chosen as the only reading llama.cpp can express exactly: rounded inv_freq carried in rope_freqs, since rounding the cos/sin tables is not expressible. Second, the recovered network is not a llama.cpp b10964 architecture. It has pre-norm LayerNorm with biases, a biased attention output and biased SwiGLU MLP, tiled grouped-query attention, half-split partial rotary with a 0.5 position scale, mu-P style multipliers and a tied head. Expressing it exactly needs weight algebra: centering the residual stream so LayerNorm equals RMSNorm, folding LayerNorm biases forward, regrouping query heads, interleaving rotary channels, and encoding the frozen channels, the position scale and the bf16-rounded frequencies in rope_freqs, or an equivalent construction. Provenance: the kite framework, its config format and the kestrel architecture were written for this task. The 6.3M-parameter checkpoint was trained by the author for 600 CPU steps on ten public-domain Project Gutenberg books, and the byte-level BPE tokenizer (4096 ids) was trained on the same text. The transcripts were generated from the true model in float64. The held-out grading texts come from seven other Gutenberg books (English, Spanish, Chinese), PyTorch and llama.cpp source files, generated logs, CSV and JSON, and hand-written multilingual and whitespace samples. The lost-code framing is a design choice, and the checkpoint is synthetic."
solution_explanation = "Reconstruct, then port. (a) Write a parametric float64 forward pass for the kite checkpoint and score each convention against the transcripts. The layout truth is the only combination that reproduces every transcript token; the bf16 rotary cache is taken from the config, because no transcript can confirm it: per-group packing [q(g,0..rep-1), k(g), v(g)] with q(g,r) = head r*n_kv+g, w_in = [up; gate], rotary on the first 16 channels in half-split layout with inv_freq = theta^(-2i/d_head) computed in fp32 and rounded to bf16, positions divided by interp_factor 2, attention scale 1/d_head. (b) Write a gguf-py converter to llama.cpp's llama architecture. With C = I - 11^T/d, use token_embd = (E * input_alpha) C^T, and multiply attn_output and ffn_down (weights and biases) by residual_alpha * C, so RMSNorm with the LayerNorm gamma equals LayerNorm. Fold each LayerNorm beta into the next biases, and scale wq and bq by sqrt(d_head)/d_head. Order query heads as [g + k*n_kv] and permute the wo columns to match. Interleave q/k channels [0,8,1,9,...,7,15,16..31]. Write rope_freqs = theta^(-2i/d_head) / (bf16(inv_freq_i) * 0.5) for the 8 rotated pairs and 1e30 for the rest. Write output.weight = E * output_alpha untied, then the byte-level BPE vocab, merges and token types with the qwen2 pre-tokenizer and add_bos, all tensors f32. solution/convert.py applies these recovered facts and solve.sh runs it and smoke-tests the result through kestrel-logits. The search scripts that established them are not shipped."
verification_explanation = "The verifier image builds the same llama.cpp b10964 and the same kestrel-logits harness from source. It copies /app/kestrel.gguf into a private directory and runs the harness on each of 21 sealed utf-8 texts as an unprivileged user, so libllama parses the untrusted file as nobody. The texts are 1 to 2048 tokens long: empty, single digit, single emoji, prose in three languages, Python and C++ source, logs, CSV, JSON, a 1,600-digit run, mixed scripts and whitespace with CRLF. For each text, the token ids must equal the sealed tokenizer.json encoding (BOS first) exactly. At every position, the log-softmax of the llama.cpp logits must be within 5e-3 nats of the true kite model, run in float64 inside the verifier (sealed modeling_kestrel.py, never shipped to the agent), for all 4096 vocab entries. Every GGUF tensor must be F32, and the file must be at most 256 MiB. Any failure gives reward 0. Measured through the built verifier image: the reference solution scores 1, and nop scores 0. A port that is exact in every respect except the bf16 rotary cache scores 0, failing 17/21 texts with errors of 0.028 to 2.85 nats. Identifiability was checked before shipping. Over a 288-combination menu of packing, head order, MLP order, rope layout, rope placement, frequency denominator and attention-temperature readings, only the truth reproduces every transcript token; the nearest wrong reading misses 86 tokens. The bf16 rotary cache is deliberately not identifiable from the transcripts: with it, without it, and with bf16 cos/sin tables, the 24 transcripts are reproduced token for token, so the agent must act on the honest config line 'rotary.cache_dtype: bfloat16' (the instruction states the config is honest). Ignoring it fails 17/21 graded texts, so the inference is decisive across many items rather than one. The llama-bpe pre-tokenizer gives identical ids for this vocab and is accepted. Casting the weights to F16 is rejected by the stated all-F32 rule."
category = "ML"
subcategory = "Inference"
tags = ["llama.cpp", "gguf", "model-conversion", "pytorch", "tokenizers", "rope", "layernorm"]
expert_time_estimate_hours = 5
relevant_experience = "I work on on-device inference for language models and have shipped several in-house checkpoints to llama.cpp, which meant writing GGUF converters with gguf-py for architectures the stock convert_hf_to_gguf.py did not know, chasing logit mismatches layer by layer with llama-eval-callback, and getting tokenizers to agree with llama.cpp's hard coded pre-tokenizer table. I have also done the weight-folding side of that job (norm and scale folding, head reordering for grouped-query attention, RoPE layout conversion) when a runtime could not be patched."

