artifacts = ["/app/kestrel.gguf"]

[task]
name = "afterquery/kestrel-gguf"

[metadata]
author_name = "Anand Pahade"
author_email = "bryandavidson737@gmail.com"
difficulty_explanation = "This is the job of the on-device ML engineer who owns shipping research checkpoints into an inference runtime they are not allowed to change. It is hard when the network is not one of the runtime's architectures, because every difference has to be expressed as an exact rewrite of the weights and metadata, and llama.cpp b10964 only offers fixed compute graphs per architecture. kestrel combines features that no single llama.cpp graph has: pre-norm LayerNorm with bias, a SwiGLU MLP with biases on all three projections, a biased attention output, grouped-query attention whose kv heads are tiled (query head h reads kv head h mod n_kv, where llama.cpp groups contiguously), partial rotary embedding over the first 16 of 32 head channels in half-split layout with positions scaled by 0.5, a 1/head_dim attention scale, residual, embedding and logit multipliers, and a tied head. The llama.cpp graphs with LayerNorm do not fit: stablelm and orion have no attention-output or FFN biases, jais uses ALiBi, jais2 has a non-gated ReLU^2 MLP, and command-r is parallel-residual. The llama graph has every bias but uses RMSNorm and refuses n_rot != head_dim. So an exact port needs inferences that conversion scripts never make. The residual stream must be projected onto mean-free vectors (centered embeddings, attention-output and down projections) so that LayerNorm equals RMSNorm, and the LayerNorm bias must be pushed into the following biases. The query heads (and wo columns) must be regrouped. Head channels must be interleaved so the half-split rotary pairs become adjacent, and the rope_freqs tensor must freeze the unrotated pairs and carry the 0.5 position scale. The remaining multipliers fold into the weights, and the head has to be untied. Each step is checkable locally against the PyTorch model, but none is a known recipe for this model, and the failure surface is a logit mismatch with no indication of which rewrite is wrong. Provenance: the kestrel architecture and modeling_kestrel.py were written for this task. The 6.3M-parameter checkpoint was trained by the author for 600 CPU steps on ten public-domain Project Gutenberg books, and the byte-level BPE tokenizer (4096 ids, qwen2-style digit splitting) was trained on the same text. The held-out texts come from seven other Gutenberg books (English, Spanish, Chinese), PyTorch and llama.cpp source files, generated access logs, CSV and JSON, and hand-written multilingual and whitespace samples. The on-device framing is a design choice, and the checkpoint itself is synthetic."
solution_explanation = "Write a gguf-py converter that targets llama.cpp's llama architecture and applies exact algebra. (1) With C = I - 11^T/d, use token_embd = (E * embedding_multiplier) C^T, and multiply attn_output and ffn_down (weights and biases) by residual_multiplier * C. Every write into the residual stream is then mean-free, so llama's RMSNorm with the LayerNorm gamma and the same eps equals the LayerNorm. (2) Fold each LayerNorm beta into the next biases: b_qkv += W_qkv beta_attn, and b_up/b_gate += W beta_mlp (the final LayerNorm has no bias). (3) Scale wq and bq by attention_multiplier * sqrt(head_dim). (4) Reorder query heads to [g + k*n_kv for g in kv heads for k in group] and permute wo columns the same way. (5) Inside each q/k head, order channels [0,8,1,9,...,7,15,16..31], so llama's adjacent-pair NORM rope rotates exactly kestrel's half-split pairs. kestrel spaces frequencies over head_dim, which equals llama's base^(-2i/n_rot) with n_rot = head_dim. (6) Write rope_freqs = [2]*8 + [1e30]*8, so rotated pairs run at half speed (position scale 0.5) and the unrotated channels get angle 0. (7) Write output.weight = E * logit_multiplier separately from token_embd. (8) Emit the byte-level BPE vocab, merges and token types with pre-tokenizer qwen2 (llama-bpe is equivalent for this vocab), add_bos true, and all tensors in f32. solve.sh runs solution/convert.py and smoke-tests it through kestrel-logits. The reference's worst log-softmax error over all held-out texts is 2.3e-4 nats on the author's machine."
verification_explanation = "The verifier image builds the same llama.cpp b10964 and the same kestrel-logits harness from source. It copies /app/kestrel.gguf into a private directory and runs the harness on each of 21 sealed utf-8 texts as an unprivileged user, so libllama parses the untrusted file as nobody. The texts are 1 to 2048 tokens long: empty, single digit, single emoji, prose in three languages and three scripts, Python and C++ source, logs, CSV, JSON, a 1,600-digit run, mixed scripts and whitespace with CRLF. For each text, the token ids must equal the sealed tokenizer.json encoding (BOS first) exactly. At every position, the log-softmax of the llama.cpp logits must be within 5e-3 nats of modeling_kestrel.py run in float64 inside the verifier, for all 4096 vocab entries. Every GGUF tensor must be F32 (checked with gguf-py), the file must be at most 256 MiB, and at least 16 sealed prompts must be present. Any failure gives reward 0. Measured through the built verifier image: the reference scores 1 (worst error 2.3e-4), and nop scores 0. Each single-rewrite ablation of the reference scores 0: no residual centering fails 21/21 texts (errors 0.026 to 0.22), no LayerNorm-bias folding 21/21, dropping the attention-output and FFN-down biases (what a stablelm-style port loses) 21/21, no query-head regrouping 21/21, no residual-multiplier fold 21/21, a tied head 21/21, no channel interleave 20/21, no 0.5 position scale 20/21, no attention-scale fold 20/21, and no partial-rotary freeze 17/21 (the misses are the tiniest texts). A starcoder pre-tokenizer mismatches tokens on 8/21 texts. A file truncated to 3 MB fails to load. Two variants are not discriminated by the logits check and are documented here. The llama-bpe pre-tokenizer gives identical ids, because the vocab has no multi-digit merges, and it is accepted. Casting the 2D weights to F16 passes the logits tolerance but is rejected by the stated all-F32 rule. The 5e-3 tolerance is about 21x the reference error and about 5x below the weakest failing ablation."
category = "ML"
subcategory = "Inference"
tags = ["llama.cpp", "gguf", "model-conversion", "pytorch", "tokenizers", "rope", "layernorm"]
expert_time_estimate_hours = 5
relevant_experience = "I work on on-device inference for language models and have shipped several in-house checkpoints to llama.cpp, which meant writing GGUF converters with gguf-py for architectures the stock convert_hf_to_gguf.py did not know, chasing logit mismatches layer by layer with llama-eval-callback, and getting tokenizers to agree with llama.cpp's hard coded pre-tokenizer table. I have also done the weight-folding side of that job (norm and scale folding, head reordering for grouped-query attention, RoPE layout conversion) when a runtime could not be patched."

