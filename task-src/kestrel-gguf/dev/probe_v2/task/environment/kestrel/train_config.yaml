# kite 0.9.3 run config (exported from the run dir, run kestrel-6m-r3)
run_name: kestrel-6m-r3
model:
  family: kestrel
  vocab_size: 4096
  d_model: 256
  n_layers: 6
  n_heads: 8
  n_kv_heads: 2
  d_head: 32
  d_ff: 704
  norm: layernorm
  norm_eps: 1.0e-05
  final_norm_bias: false
  mlp: swiglu_fused
  qkv: fused_grouped
  bias: true
  tie_embeddings: true
  max_seq_len: 2048
  rotary:
    pct: 0.5
    theta: 10000.0
    interp_factor: 2.0
  mup:
    input_alpha: 6.0
    residual_alpha: 0.35
    attn_temperature: inverse_d
    output_alpha: 0.25
tokenizer:
  path: tokenizer.json
  bos_id: 1
  eos_id: 2
train:
  seq_len: 128
  global_batch: 16
  steps: 600
  lr: 2.0e-3
  schedule: cosine
  warmup: 100
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.05
  grad_clip: 1.0
  dtype: float32
