artifacts = ["/app/out/restore.db", "/app/out/uncertain.txt"]

[task]
name = "afterquery/quorum-loss"

[metadata]
author_name = "Shaswat Panda"
author_email = "pandashaswat712@gmail.com"
difficulty_explanation = "This is the job of the SRE who owns an etcd 3.5.17 cluster that lost quorum for good: three of five members are gone, and the only evidence left is two member data dirs (raft WAL, snap files, bbolt backend) and the services' JSON logs of every call they made to the grpc gateway. The job is to restore exactly the raft committed keyspace and to say exactly which keys the evidence cannot settle. The textbook recovery is etcd's own: boot the most complete survivor with --force-new-cluster, or restore its member/snap/db. That is wrong here in both directions. m5's log is the longest by far (index 3606, against 2437 for m4), but everything it holds from index 1978 on is a term 3 branch that an isolated leader appended and never committed. m4 carries term 3 and term 4 entries from that index on, and its persisted commit index of 2434 is past the divergence, so the branch is dead, and the timed out calls that sit only on it never happened. m4 itself is incomplete. Its HardState commit stops at 2434 and three of its entries are past it. The lost members committed thirty eight more writes that exist on no surviving disk and show up only as acks in the call logs, with revision numbers in the response headers. Putting them in requires etcd's MVCC rule that every put and every txn that writes bumps the main revision once, and replaying them in revision order with each txn's compares evaluated against the replayed state. Two inferences go past what the raft paper or the etcd docs spell out, and each one decides several keys. First, m4's last entry, a write at index 2437, was never acknowledged, and a later leader could in principle have put a different entry at that index. The evidence still settles it, because all 49 responses past m4 report raft_term 4, which bounds the term of every entry up to them at 4. The term 4 entry at 2437 can only be the term 4 leader's own entry, which is m4's. Without that argument eight settled keys look open. Second, a call that was still open at the crash can only have committed below every acknowledged write that was sent after it ended, and those revisions are all accounted for. That retires eight calls that were in flight to m4 when its shelf lost power, while later calls through the other members were still being acknowledged. Without that argument nine settled keys look open. The calls have to be sorted by evidence, not by error message. Connection refused calls never reached etcd. The 15 reset and closed calls that remain open have to be taken over every order and subset that touches the same keys, with txn compares re evaluated in each, which leaves 19 keys unsettled. The answer does not depend on any argument about the exact moment a member died: it is the same whether or not one also cuts off calls sent after quorum was lost or calls to a member after its first dropped connection, because calls whose fate hung on that were removed from the case. Each of these was run through the verifier and scores 0: force-new-cluster on m4 (19 extra keys, 33 wrong values, 5 missing) or on m5 (152 wrong values), stopping at m4's persisted commit (no history fits the acks), dropping the raft_term argument (8 settled keys written off) and dropping the rule for open calls (9 settled keys written off). On this case the read results and one way linearizability do not change the answer. The data is synthetic but produced by the real software. A real five member etcd 3.5.17 cluster was driven by scripted services through the grpc gateway, with members frozen with SIGSTOP to isolate a leader and killed with SIGKILL for the outage. The WALs, snapshots, bbolt db files and response headers are exactly what etcd wrote, and the call logs are the scripted clients' real requests and responses, minus three crash window calls removed so that no answer hinges on millisecond death timing. The outage story and the service names are framing."
solution_explanation = "solve.sh runs recover.py, which reads both WALs with etcd-dump-logs --start-index 1 and parses the logged requests (put, txn, delete_range, lease grant and revoke). m5 diverges from m4 at index 1978, and m4's HardState commit (2434) is past that point, so m4's log is the committed prefix up to 2434 and m5's branch is dead. A small model of etcd's MVCC apply (revision bumps, txn compares on VERSION and MOD, prefix deletes, lease attachment) replays m4 from index 2, and it reproduces m4's bbolt db exactly at its consistent_index (2389). Every logged call is matched to its WAL entry by its request body, which is unique, and classified as acknowledged (with header revision, raft_term and txn succeeded flag), refused (never reached etcd), or unknown (timeout, reset, closed connection). The solver then enumerates every history the evidence allows. A history is m4's log cut at some point c, followed by a suffix of logged calls. Acked calls must sit in their own revision slot with the right txn outcome. Every range read must match the replayed state at its revision. Every complete watch stream on /config/ must match the replayed changes. A call must land above every revision observed before it was sent and below every acked write sent after it ended. raft_term in response headers bounds the term of every entry up to that revision, which rules out the cut at 2436. Calls sent after quorum was lost (second death among m1 to m4, dated by refused or dropped connections; m5 never reached the last term) are out, a rule that changes nothing on this case. That leaves one history up to the last observed revision, followed by any order and subset of the 15 remaining open calls, enumerated per group of calls that touch the same keys. A key is restored if every history gives it the same final value, and listed as uncertain if two histories disagree. The restored keys are written into a scratch single member etcd 3.5.17 through the gateway, and etcdctl snapshot save produces /app/out/restore.db."
verification_explanation = "The verifier image holds truth.json, the sealed keyspace: 244 keys with their values, and the 19 keys the evidence cannot settle. It was computed by the same evidence only enumeration from the shipped data alone, and the answer was checked to be identical under the alternative readings of member death timing. The real history, the lost leader's full WAL, was never shipped and was used only to check that every settled key matches it and that the real history is one of the enumerated ones. The verifier never runs agent code. It copies /app/out/restore.db, restores it with the real etcdutl 3.5.17 (snapshot restore --skip-hash-check), boots a single etcd on the restored data dir, and reads the whole keyspace back through the grpc gateway. It checks that no key is present that should not be, that no settled key is missing, that every value is exact, that /app/out/uncertain.txt lists exactly the 19 open keys with no blanks or duplicates, and that no uncertain key was restored. Reward is 1 only if every check passes. Run through this verifier, the reference solution scores 1; force-new-cluster on m4 or m5, the reference cut at m4's persisted commit, the reference without the raft_term bound, and the reference without the rule for open calls all score 0."
category = "Software"
subcategory = "Databases"
tags = ["etcd", "raft", "disaster-recovery", "mvcc", "grpc-gateway", "wal"]
expert_time_estimate_hours = 4
relevant_experience = "I have run etcd clusters under Kubernetes control planes and recovered them after losing quorum, including restoring from a surviving member with --force-new-cluster and finding afterwards that writes clients had been told failed had come back, and others they had been told succeeded were gone. That work meant reading WAL dumps with etcd-dump-logs, comparing the bbolt backend with etcd-dump-db against the WAL, and matching client side request logs and response revisions against the log by hand to decide what the cluster had really committed."

