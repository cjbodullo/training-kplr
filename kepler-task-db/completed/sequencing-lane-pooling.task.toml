[task]
name = "afterquery/sequencing-lane-pooling"

[metadata]
author_name = "Shaswat Panda"
author_email = "pandashaswat712@gmail.com"
category = "Science"
subcategory = "Biology"
tags = ["genomics", "ngs", "illumina", "index-compatibility", "pooling", "optimization"]
expert_time_estimate_hours = 12
difficulty_explanation = """This is the weekly run planning decision a sequencing core facility's lab manager makes: turn the library queue into a set of NovaSeq 6000 flowcells, choosing each flowcell's type and read recipe and pooling libraries lane by lane (XP workflow), at the lowest spend, such that every lane would actually demultiplex and actually fit. The packing itself is variable size bin packing with pairwise conflicts: two libraries share a lane only if their i7 or i5 differ in at least three positions as read, a lane of two or more libraries must show a non G base at every index cycle on two channel chemistry, index read lengths are set per run so 8 and 10 base kits cannot share a flowcell, a coverage based library's cluster requirement changes with the recipe chosen, co run projects must share a flowcell, and 16S libraries need 2x250 which only the SP flowcell offers. The harder part is that not one number the packing needs is stated cleanly, and the SOP says only which record outranks which, never how to read the evidence. What a library actually carries has to be established from the demultiplexing record of prior runs: five queued libraries were prepped from a different well than the LIMS records and their reads sit in Undetermined under another well's barcode, one of them from a different vendor's plate altogether so the match only appears in that kit's own i5 orientation, one lane holds two such libraries from two kits, one library's true well is another queued library's well so the two can never share a lane, and a legitimately tiny library in the same run looks lost by any read count threshold but has no matching unknown barcode. One kit's manifest header misstates the strand of its i5 column, provable only from a prior sheet that demultiplexed, while another kit was once sheeted with the manifest column as printed and produced nothing, so neither manifests nor prior sheets can be trusted blindly. What each library still needs is contract coverage minus what earlier lanes delivered, counted in bases because the earlier run used a different read length, excluding a lane whose %>=Q30 failed although the instrument flagged it complete and excluding reads that landed in Undetermined. The plannable yield per flowcell type is the lowest QC passing, correctly loaded lane in a twelve month window, where the status column lies both ways, two in window lanes were underloaded, and the true minimum for two types is a lane the instrument marked with warnings. The LIMS carries stale duplicate preps, a held project and a 'requested 30x' note that contradicts a 40x contract. The optimal plan packs the S4 lanes to within a percent of their yield, so each of these readings taken at face value produces a plan that is confidently wrong: over a real lane's capacity, a sheet that would not demultiplex, an extra library, or a spare flowcell above the minimum. All records, sequences and run reports are synthetic and generated for this task in the real formats (Sample Sheet v2, BCL Convert Demultiplex_Stats and Top_Unknown_Barcodes, kit manifests, a LIMS export), so nothing about the answer exists online. The plan is graded whole against the sealed model at the exact minimum price."""
solution_explanation = """Rebuild the true model from the drop, then pack it exactly. Yields: from run_history.csv take, per flowcell type, the lowest pf_clusters of a lane dated within twelve months of 2026-09-21 whose pct_q30 is at least 80.0 and whose loading_log.csv entry sits in 350 to 450 pM, ignoring run_status, and keep 99 percent of it for the PhiX spike. Indices: read each kit manifest and reverse complement the i5 column where its header says so, then check the prior sample sheets against the manifests using only libraries that demultiplexed well (at least half a percent of their lane): the UDP-B sheet lists Index2 as the reverse complement of the manifest column and demultiplexed, so that header is wrong and its i5 must be reverse complemented; the CDX-10 lane on R260305 listed the column as printed and produced nothing, so it is not evidence, and the later CDX-10 run confirms the manifest. For every prior lane, find libraries with essentially no reads (under 0.05 percent of the lane), skip lanes where every library failed (a sheet level failure), and take the unknown barcodes that each hold at least 15 percent of the lane's Undetermined; map each such pair to a well across all kits in as read orientation. One lost library with one dominant pair is that pair's kit and well, even when the kit differs from the LIMS; two lost libraries in one lane are attributed by matching the pair's kit to each library's recorded kit. A library with a small but real read count and no dominant pair is simply small and keeps its recorded well. Five queued libraries move this way, one of them onto a well another queued library also uses. Queue: libraries with status queued whose project is active, and for a sample with two queued preps only the highest prep number. Requirements: contracted_coverage times genome_bp for WGS, times target_bp over 0.75 for WES, contracted_clusters for RNA and 16S, taken from projects.csv not from LIMS notes; subtract what prior lanes with pct_q30 at or above 80.0 delivered, as bases (reads times two times that run's read length) for coverage libraries so the 2x100 run is converted correctly, never counting a lost library's undetermined reads; the remaining clusters depend on the planned recipe. Packing: the price depends only on the multiset of (flowcell, recipe) bought and a flowcell holds one index length class, so for each class enumerate configurations of up to four flowcells in increasing price and take the first that admits a lane assignment, checked with CP-SAT under all lane rules (capacity at the recipe's requirements, pairwise index distance, colour balance, minimum read length, co run). Cluster counts are scaled to ten thousand cluster units with conservative rounding for the feasible answer and optimistic rounding for the infeasibility proofs, which sidesteps solver precision problems with billion scale coefficients; the two roundings agree on every configuration here. The minimum is 37600: one S4 at 2x150 for the eight base libraries, two SP at 2x250 carrying the 16S libraries with WGS libraries that shrink at 250 cycles, and one S2 at 2x150 for the ten base mouse and RNA libraries. Write runs.csv and one Sample Sheet v2 per flowcell with Index2 in as read orientation."""
verification_explanation = """The deliverable is data and the verifier runs nothing the agent produced. It reads /app/plan/runs.csv and each /app/plan/<run_id>/SampleSheet.csv with a strict Sample Sheet v2 parser (the [Reads] cycle counts and the Lane, Sample_ID, Index, Index2 rows) and grades the plan against the sealed true model that lives only in the verifier image: the set of libraries that must be sequenced, each one's actual i7 and as read i5, its minimum read length, its remaining cluster requirement at every recipe, the usable yield per flowcell type, the price list and the baked minimum price. A plan passes only if every required library appears exactly once and nothing else appears, every row carries the true index pair and the run's index cycle counts match, every flowcell's recipe is offered for that type and long enough for its libraries, every lane's pooled requirement at that recipe fits the usable yield, no lane pairs two libraries closer than three mismatches on both indices, no pooled lane reads G at every position of an index cycle, co run projects sit on one flowcell, and the summed flowcell price equals the sealed minimum. Over and under both fail: a feasible plan with a spare flowcell fails on price, and a cheaper plan built on a misread of the drop has a lane over its real yield, a wrong index, or an extra library. The minimum is baked at build time and independently re derived by the verifier with the same configuration enumeration and CP-SAT feasibility bracket; a disagreement aborts the run as a verifier defect rather than passing. Guard tests also prove the grader rejects a missing library, a flipped index, a foreign library, an overfilled lane and a costlier feasible plan. Grading is all or nothing, the verifier runs in its own image, and a 0 or 1 reward plus a CTRF report is written on every path including a crash."""
relevant_experience = "I have run the sequencing side of a genomics core: pooling libraries by index compatibility and colour balance across mixed kits, planning NovaSeq flowcell loads from contracted coverage and what earlier lanes actually delivered, and tracing demultiplexing failures back to mis-recorded wells and i5 orientation mistakes in vendor manifests."

