<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 300px; margin: 0; padding: 14px; font-family: system-ui, sans-serif; background: #16181d; color: #e6e8ec; }
      h1 { font-size: 14px; margin: 0; }
      p { font-size: 11.5px; color: #9aa0a8; margin: 8px 0 0; line-height: 1.5; }
      button { width: 100%; margin-top: 12px; height: 34px; border: none; border-radius: 7px; background: #5b6cff; color: #fff; font-weight: 600; font-size: 12.5px; cursor: pointer; }
      .status { margin-top: 12px; font-size: 11.5px; padding: 8px 10px; border-radius: 7px; background: #0f1115; border: 1px solid #2a2e35; line-height: 1.5; }
      .ok { color: #4ade80; } .err { color: #f87171; } .muted { color: #9aa0a8; }
      label { display:block; font-size: 11px; color:#9aa0a8; margin-top: 12px; }
      input { width: 100%; box-sizing: border-box; margin-top: 5px; height: 30px; padding: 0 8px; border-radius: 6px; border: 1px solid #2a2e35; background:#0f1115; color:#e6e8ec; font-size: 12px; }
      button.secondary { background:#2a2e35; }
    </style>
  </head>
  <body>
    <div style="display:flex;align-items:center;gap:8px;">
      <img src="icon48.png" alt="AQ Bot" style="width:22px;height:22px;object-fit:contain;" />
      <h1>AQ Bot Token Bridge</h1>
    </div>
    <p>Open <b>experts.afterquery.com</b> and sign in with Google. Your token syncs to the token server automatically — make sure <code>token_write.js</code> is running.</p>

    <label for="serverUrl">Token server URL</label>
    <input id="serverUrl" type="text" placeholder="http://109.199.116.56:47615" />
    <label for="serverSecret">Shared secret (must match KEPLER_TOKEN_SECRET)</label>
    <input id="serverSecret" type="password" placeholder="required when server is public" />
    <button id="save" class="secondary">Save settings</button>

    <button id="sync">Sync token now</button>
    <div class="status" id="status">…</div>
    <script src="popup.js"></script>
  </body>
</html>
